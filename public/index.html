<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agar.io Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-container">
        <div class="glass-panel fade-in menu-box">
            <h1 class="title">Agar.io</h1>
            <p class="subtitle">Enter the arena</p>
            <input type="text" id="nickname" placeholder="Nickname (optional)" maxlength="15">
            <button id="play-btn">Play as Guest</button>
        </div>
    </div>

    <!-- Game UI (Hidden initially) -->
    <div id="game-ui" style="display: none;">
        <canvas id="game-canvas"></canvas>
        
        <!-- Network Diagnostics Overlay -->
        <div class="glass-panel fade-in diagnostics">
            <h3>Network Diagnostics</h3>
            <div class="stat-row">
                <span class="stat-label">Client FPS:</span>
                <span id="stat-fps" class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Ping:</span>
                <span id="stat-ping" class="stat-value">0 ms</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Packets Rx:</span>
                <span id="stat-rx" class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Packets Tx:</span>
                <span id="stat-tx" class="stat-value">0</span>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
